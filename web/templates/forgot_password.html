{% extends "base.html" %}
{% block title %}Forgot Password — WebSecScanner{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card">
        <div class="auth-header">
            <h1 class="gradient-text">Reset Password</h1>
            <p>Enter your email address to receive a password reset link.</p>
        </div>

        <form action="/forgot-password" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="john@example.com" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">Send Reset Link</button>
        </form>

        <div class="auth-footer">
            <p>Remembered your password? <a href="/login">Log In</a></p>
        </div>
    </div>
</div>
{% endblock %}
