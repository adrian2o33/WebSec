{% extends "base.html" %}
{% block title %}Log In — WebSecScanner{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card">
        <div class="auth-header">
            <h1 class="gradient-text">Welcome Back</h1>
            <p>Log in to access your dashboard and scans.</p>
        </div>

        <form action="/login{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="john@example.com" required>
            </div>
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <label for="password" style="margin-bottom: 0;">Password</label>
                    <a href="/forgot-password" style="font-size: 0.9rem; color: var(--accent-primary); text-decoration: none;">I forgot my password</a>
                </div>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">Log In</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="/register">Sign Up</a></p>
        </div>
    </div>
</div>
{% endblock %}
